<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>KPI Addon T11 (18/11) — Team Nguyễn Ái Quốc</title>
<style>
  :root {
    --bg: #eef2f6;
    --card: #ffffff;
    --soft: #f8fafc;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --blue: #2563eb;
    --blue-bg: #eff6ff;
    --green: #15803d;
    --green-bg: #dcfce7;
    --amber: #b45309;
    --amber-bg: #fef3c7;
    --red: #dc2626;
    --red-bg: #fee2e2;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    padding-bottom: 84px;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* Hero Header */
  .hero {
    background: linear-gradient(145deg, #0f172a 0%, #1d4ed8 100%);
    color: #fff;
    padding: 20px 16px 22px;
    border-bottom-left-radius: 24px;
    border-bottom-right-radius: 24px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.22);
  }
  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .hero-badge {
    display: inline-block;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.24);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }
  .hero h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .hero-sub {
    font-size: 12.5px;
    color: #cbd5e1;
    margin-top: 3px;
  }
  .hero-score-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 16px;
    margin-bottom: 7px;
  }
  .hero-score-big {
    font-size: 28px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .hero-score-big span { font-size: 15px; font-weight: 600; color: #bfdbfe; }
  .hero-pct {
    font-size: 18px;
    font-weight: 800;
    background: rgba(255,255,255,0.18);
    padding: 3px 10px;
    border-radius: 999px;
  }
  .hero-bar {
    height: 10px;
    background: rgba(255,255,255,0.2);
    border-radius: 999px;
    position: relative;
    overflow: hidden;
  }
  .hero-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #4ade80, #22d3ee);
    border-radius: 999px;
  }
  .hero-bar-mark {
    position: absolute;
    left: 60%;
    top: 0; bottom: 0;
    width: 2px;
    background: rgba(255,255,255,0.85);
  }
  .hero-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  .hero-stat {
    background: rgba(255,255,255,0.11);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .hero-stat-label { font-size: 11px; color: #cbd5e1; font-weight: 600; }
  .hero-stat-val { font-size: 16px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .hero-stat-sub { font-size: 11px; color: #dbeafe; margin-top: 1px; }

  .hero-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .hero-btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .hero-btn-white { background: #fff; color: #1e3a8a; }
  .hero-btn-glass { background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.22); }
  .hero-btn:active { transform: scale(0.98); }

  /* Sticky Controls */
  .sticky-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(238, 242, 246, 0.94);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 12px 14px 10px;
    border-bottom: 1px solid rgba(226, 232, 240, 0.8);
  }
  .seg-control {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: #dbe3ee;
    padding: 3px;
    border-radius: 11px;
    margin-bottom: 10px;
  }
  .seg-btn {
    border: none;
    background: transparent;
    padding: 8px 10px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 700;
    color: #475569;
    cursor: pointer;
  }
  .seg-btn.active {
    background: #fff;
    color: var(--blue);
    box-shadow: 0 1px 4px rgba(15,23,42,0.1);
  }
  .search-box {
    position: relative;
    margin-bottom: 9px;
  }
  .search-box input {
    width: 100%;
    padding: 11px 36px 11px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    font-size: 16px; /* prevents iOS zoom */
    background: #fff;
    color: var(--text);
    outline: none;
  }
  .search-box input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.14); }
  .clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: #e2e8f0;
    color: #475569;
    width: 22px;
    height: 22px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    display: none;
    cursor: pointer;
  }
  .clear-btn.show { display: inline-flex; align-items: center; justify-content: center; }

  .chips-scroll {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .chips-scroll::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid #cbd5e1;
    background: #fff;
    color: #475569;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .chip.active {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }

  /* Staff Cards List */
  .list-wrap {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .staff-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(15,23,42,0.04);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .staff-card.open {
    border-color: #93c5fd;
    box-shadow: 0 4px 16px rgba(37,99,235,0.1);
  }
  .card-head {
    padding: 14px 14px 12px;
    cursor: pointer;
  }
  .card-row1 {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .card-left {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    min-width: 0;
  }
  .rank {
    flex: 0 0 28px;
    height: 28px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
    background: #f1f5f9;
    color: #475569;
    margin-top: 2px;
  }
  .rank-top { background: #dcfce7; color: #15803d; }
  .rank-low { background: #fee2e2; color: #dc2626; }
  .s-name {
    font-size: 15.5px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.25;
  }
  .s-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .card-right {
    text-align: right;
    flex-shrink: 0;
  }
  .s-score {
    font-size: 17px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .s-score small { font-size: 12px; font-weight: 600; color: var(--muted); }
  .s-pct {
    font-size: 12.5px;
    font-weight: 800;
    margin-top: 2px;
  }

  .bar-track {
    height: 8px;
    background: #e2e8f0;
    border-radius: 999px;
    position: relative;
    overflow: hidden;
    margin: 10px 0 9px;
  }
  .bar-fill { height: 100%; border-radius: 999px; }
  .bar-mark {
    position: absolute;
    left: 60%;
    top: 0; bottom: 0;
    width: 2px;
    background: rgba(15,23,42,0.35);
  }
  .c-green { color: var(--green); }
  .c-blue { color: var(--blue); }
  .c-amber { color: var(--amber); }
  .c-red { color: var(--red); }
  .bg-green { background: linear-gradient(90deg, #16a34a, #22c55e); }
  .bg-blue { background: linear-gradient(90deg, #2563eb, #3b82f6); }
  .bg-amber { background: linear-gradient(90deg, #d97706, #f59e0b); }
  .bg-red { background: linear-gradient(90deg, #dc2626, #ef4444); }

  .mini-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    justify-content: space-between;
  }
  .pill-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .mpill {
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  .mp-slate { background: #f1f5f9; color: #334155; }
  .mp-green { background: var(--green-bg); color: var(--green); }
  .mp-red { background: var(--red-bg); color: var(--red); }
  .mp-amber { background: var(--amber-bg); color: var(--amber); }

  .expand-hint {
    font-size: 12px;
    font-weight: 700;
    color: var(--blue);
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  /* Expanded Body */
  .card-body {
    display: none;
    background: #f8fafc;
    border-top: 1px solid var(--border);
    padding: 12px 14px 14px;
  }
  .staff-card.open .card-body { display: block; }

  .sec-title {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 10px 0 7px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sec-title:first-child { margin-top: 0; }

  .case-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 10px 11px;
    margin-bottom: 7px;
  }
  .case-card.is-bu { border-left: 4px solid #16a34a; }
  .case-card.is-rec { border-left: 4px solid #f59e0b; }
  .case-card.is-hard { border-left: 4px solid #dc2626; }
  .case-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .case-type { font-size: 12px; font-weight: 800; }
  .ret-btn {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    font-weight: 700;
    background: #eef2ff;
    color: #1e40af;
    border: 1px solid #c7d2fe;
    padding: 2px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .ret-btn:active { background: #dbeafe; }
  .case-detail {
    font-size: 12.5px;
    color: #334155;
    line-height: 1.4;
  }
  .case-reason {
    font-size: 12px;
    color: #b91c1c;
    font-weight: 600;
    margin-top: 3px;
  }
  .case-reason.ok-note { color: #15803d; }

  .copy-person-btn {
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    border: 1px solid #bfdbfe;
    background: #eff6ff;
    color: #1d4ed8;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .copy-person-btn:active { background: #dbeafe; }

  .clean-ok {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #15803d;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
  }

  .hidden { display: none !important; }
  .empty {
    text-align: center;
    padding: 36px 16px;
    color: var(--muted);
    font-size: 14px;
  }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translate(-50%, 16px);
    background: #0f172a;
    color: #fff;
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 10px 24px rgba(0,0,0,0.28);
    opacity: 0;
    pointer-events: none;
    transition: all 0.22s ease;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">
  <div class="hero" id="heroSection"></div>

  <div class="sticky-bar">

  <div class="list-wrap" id="mainList"></div>
</div>

<div class="toast" id="toast"></div>

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function copyText(text, label) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('✅ Đã copy ' + label)).catch(() => fallbackCopy(text, label));
  } else {
    fallbackCopy(text, label);
  }
}

function fallbackCopy(text, label) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); showToast('✅ Đã copy ' + label); } catch(e) { showToast('❌ Không thể copy'); }
  document.body.removeChild(ta);
}

function copyRet(val, e) {
  if (e) e.stopPropagation();
  copyText(val, 'mã ' + val);
}

  }
  if (s.bu_pay_list.length) {
    lines.push(`✅ CỘNG BÙ PAYMENT T10 SANG T11 (+${s.bu_pay_pts}đ / ${s.bu_pay_list.length} ca):`);

  }
  if (s.pay_khl_list.length || s.hd_cx_list.length || s.ks_list.length) {

    }
    if (s.hd_cx_list.length) {

      s.hd_cx_list.forEach(h => lines.push(`   - Retailer ${h.ret} (SC: ${h.sc}) -> ${h.reason}`));
    }
    if (s.ks_list.length) {
      lines.push(`  [Kship T11: -${s.ks_tru}đ / ${s.ks_list.length} ca]`);
      s.ks_list.forEach(k => lines.push(`   - Ticket ${k.ticket} (Ret: ${k.ret}) | ${k.status} | Trừ ${k.tru} -> ${k.reason}`));
    }
  } else {
    lines.push(`✨ Khớp 100% dữ liệu T11, không có ca bị trừ.`);
  }
  return lines.join('\n');
}

function copyPerson(code, e) {
  if (e) e.stopPropagation();
  const s = DATA.staff.find(x => x.code === code);
  if (s) copyText(buildPersonZalo(s), 'báo cáo ' + s.short_name);
}

function copyAllTeam() {
  copyText(DATA.zalo_all, 'báo cáo cả Team Quốc');
}

function toggleAll() {
  allOpen = !allOpen;
  if (allOpen) DATA.staff.forEach(s => openCodes.add(s.code));
  else openCodes.clear();
  renderMain();
}

function getAllIssueCases() {
  let arr = [];
  DATA.staff.forEach(s => {
    s.pay_khl_list.forEach(p => arr.push({
      kind: 'PAY', label: '💳 Payment', staff: s, ret: p.ret, idShow: p.ret, act: p.act,
      date: p.sc, extra: `ĐK: ${p.dk} • Digi: ${p.digi} ngày`, reason: p.reason,
      tru: '-5đ', recoverable: p.recoverable
    }));
    s.hd_cx_list.forEach(h => arr.push({
      kind: 'HDDT', label: '🧾 HĐĐT', staff: s, ret: h.ret, idShow: h.ret, act: h.act,
      date: h.sc, extra: `Phát hành: ${h.ph}`, reason: h.reason,
      tru: '-5đ', recoverable: h.recoverable
    }));
    s.ks_list.forEach(k => arr.push({
      kind: 'KSHIP', label: '🚚 Kship', staff: s, ret: k.ret, idShow: k.ticket, act: k.ret,
      date: 'T11/2026', extra: `Retailer: ${k.ret} • TT: ${k.status}`, reason: k.reason,
      tru: k.tru, recoverable: k.recoverable
    }));
  });
  return arr;
}

function renderHero() {
  const st = DATA.staff;
  const totKpi = st.reduce((a,b)=>a+b.kpi, 0);
  const totChot = st.reduce((a,b)=>a+b.chot, 0);
  const totSelf = st.reduce((a,b)=>a+b.self_pts, 0);
  const pct = (totChot / totKpi * 100).toFixed(1);
  const p100 = st.filter(x => x.pct >= 100).length;
  const p60 = st.filter(x => x.pct >= 60).length;
  const buHd = st.reduce((a,b)=>a+b.bu_hd_pts, 0);
  const buPay = st.reduce((a,b)=>a+b.bu_pay_pts, 0);
  const tru = st.reduce((a,b)=>a+b.tru_total, 0);
  const allCases = getAllIssueCases();
  document.getElementById('casesCountBadge').textContent = allCases.length;

  document.getElementById('heroSection').innerHTML = `
    <div class="hero-top">
      <div>
        <div class="hero-badge">COACHER NGUYỄN ÁI QUỐC • 18/11/2026</div>
        <h1>KPI Addon Tháng 11</h1>
        <div class="hero-sub">16 Nhân sự • Tiến độ chuẩn mốc 18/30 ngày (60%)</div>
      </div>
    </div>
    <div class="hero-score-row">
      <div class="hero-score-big">${totChot}đ <span>/ ${totKpi}đ</span></div>
      <div class="hero-pct">${pct}%</div>
    </div>
    <div class="hero-bar">
      <div class="hero-bar-fill" style="width:${Math.min(pct, 100)}%"></div>
      <div class="hero-bar-mark"></div>
    </div>
    <div class="hero-stats">
      <div class="hero-stat">
        <div class="hero-stat-label">🟢 Về đích ≥ 100%</div>
        <div class="hero-stat-val">${p100} / ${st.length} NS</div>
        <div class="hero-stat-sub">Minh Đức, Anh Vũ, Trọng Đạo</div>
      </div>
      <div class="hero-stat">
        <div class="hero-stat-label">🔵 Đạt tiến độ ≥ 60%</div>
        <div class="hero-stat-val">${p60} / ${st.length} NS</div>
        <div class="hero-stat-sub">Còn ${st.length - p60} NS dưới 60%</div>
      </div>
      <div class="hero-stat">
        <div class="hero-stat-label">✅ Cộng bù T10 → T11</div>
        <div class="hero-stat-val">+${buHd + buPay}đ</div>
        <div class="hero-stat-sub">HĐĐT +${buHd}đ • Pay +${buPay}đ</div>
      </div>
      <div class="hero-stat">
        <div class="hero-stat-label">⚠️ Đang trừ T11</div>
        <div class="hero-stat-val">-${tru}đ (${allCases.length} ca)</div>
        <div class="hero-stat-sub">Tự ghi nhận: ${totSelf}đ</div>
      </div>
    </div>
    <div class="hero-actions">
      <button class="hero-btn hero-btn-white" onclick="copyAllTeam()">📋 Copy Zalo Cả Team</button>
      <button class="hero-btn hero-btn-glass" onclick="toggleAll()">↕️ Mở / Đóng hết</button>
    </div>
  `;
}

function renderChips() {
  const el = document.getElementById('filterChips');
  if (viewMode === 'staff') {
    const st = DATA.staff;
    const c100 = st.filter(x => x.pct >= 100).length;
    const c60 = st.filter(x => x.pct >= 60 && x.pct < 100).length;
    const cLow = st.filter(x => x.pct < 60).length;
    const cBu = st.filter(x => x.bu_total > 0).length;
    const chips = [
      ['ALL', `Tất cả (${st.length})`],
      ['LOW', `🔴 Cần thúc <60% (${cLow})`],
      ['PASS', `🟢 Đạt 100% (${c100})`],
      ['MID', `🔵 60–99% (${c60})`],
      ['BU', `✅ Có bù T10 (${cBu})`]
    ];
    el.innerHTML = chips.map(([k, lbl]) => `<button class="chip ${staffFilter===k?'active':''}" onclick="setStaffFilter('${k}')">${lbl}</button>`).join('');
  } else {
    const all = getAllIssueCases();
    const cPay = all.filter(x => x.kind === 'PAY').length;
    const cHd = all.filter(x => x.kind === 'HDDT').length;
    const cKs = all.filter(x => x.kind === 'KSHIP').length;
    const cRec = all.filter(x => x.recoverable).length;
    const chips = [
      ['ALL', `Tất cả (${all.length})`],
      ['REC', `⚡ Kéo lại được (${cRec})`],
      ['PAY', `💳 Payment (${cPay})`],
      ['HDDT', `🧾 HĐĐT (${cHd})`],
      ['KSHIP', `🚚 Kship (${cKs})`]
    ];
    el.innerHTML = chips.map(([k, lbl]) => `<button class="chip ${caseFilter===k?'active':''}" onclick="setCaseFilter('${k}')">${lbl}</button>`).join('');
  }
}

function switchView(mode) {
  viewMode = mode;
  document.getElementById('segStaff').classList.toggle('active', mode === 'staff');
  document.getElementById('segCases').classList.toggle('active', mode === 'cases');
  renderChips();
  renderMain();
}

function setStaffFilter(f) { staffFilter = f; renderChips(); renderMain(); }
function setCaseFilter(f) { caseFilter = f; renderChips(); renderMain(); }

function onSearch() {
  const v = document.getElementById('qInput').value;
  document.getElementById('clearBtn').classList.toggle('show', v.length > 0);
  renderMain();
}

function clearSearch() {
  document.getElementById('qInput').value = '';
  document.getElementById('clearBtn').classList.remove('show');
  renderMain();
}

function toggleCard(code) {
  if (openCodes.has(code)) openCodes.delete(code);
  else openCodes.add(code);
  const card = document.getElementById('card-' + code);
  if (card) card.classList.toggle('open', openCodes.has(code));
}

function renderCardBody(s) {
  const hasBu = s.bu_hd_list.length || s.bu_pay_list.length;
  const hasDed = s.pay_khl_list.length || s.hd_cx_list.length || s.ks_list.length;
  let out = '';

  if (!hasBu && !hasDed) {
    out += `<div class="clean-ok">✨ Khớp 100% dữ liệu tháng 11, chưa có ca nào bị trừ.</div>`;
  }

  if (hasBu) {
    out += `<div class="sec-title c-green"><span>✅ Cộng bù T10 → T11</span><span>+${s.bu_total}đ</span></div>`;
    s.bu_hd_list.forEach(b => {
      out += `<div class="case-card is-bu">
        <div class="case-top">
          <span class="case-type c-green">🧾 HĐĐT Bù (+5đ)</span>
          <button class="ret-btn" onclick="copyRet('${b.ret}', event)">ID: ${b.ret}</button>
        </div>
        <div class="case-detail">SC: ${b.sc} → Phát hành: <strong>${b.ph}</strong> (${b.diff}, ${b.einv} HĐ)</div>
      </div>`;
    });
    s.bu_pay_list.forEach(p => {
      out += `<div class="case-card is-bu">
        <div class="case-top">
          <span class="case-type c-green">💳 Payment Bù (+5đ)</span>
          <button class="ret-btn" onclick="copyRet('${p.ret}', event)">ID: ${p.ret}</button>
        </div>
        <div class="case-detail">SC: ${p.sc} • Digi 31/10: ${p.old_digi} → 18/11: <strong>${p.new_digi}</strong></div>
      </div>`;
    });
  }

  if (hasDed) {
    out += `<div class="sec-title c-red"><span>❌ Chưa ghi nhận / Đang trừ T11</span><span>-${s.tru_total}đ</span></div>`;
    s.pay_khl_list.forEach(p => {
      out += `<div class="case-card ${p.recoverable ? 'is-rec' : 'is-hard'}">
        <div class="case-top">
          <span class="case-type ${p.recoverable ? 'c-amber' : 'c-red'}">💳 Payment (-5đ) • ${p.recoverable ? 'Kéo lại được' : 'Lỗi cứng'}</span>
          <button class="ret-btn" onclick="copyRet('${p.ret}', event)">ID: ${p.ret}</button>
        </div>
        <div class="case-detail">SC: ${p.sc} • ĐK: ${p.dk} • Digi: <strong>${p.digi} ngày</strong></div>
        <div class="case-reason">${p.reason}</div>
      </div>`;
    });
    s.hd_cx_list.forEach(h => {
      out += `<div class="case-card ${h.recoverable ? 'is-rec' : 'is-hard'}">
        <div class="case-top">
          <span class="case-type ${h.recoverable ? 'c-amber' : 'c-red'}">🧾 HĐĐT (-5đ) • ${h.recoverable ? 'Chờ xuất HĐ' : 'Lỗi cứng'}</span>
          <button class="ret-btn" onclick="copyRet('${h.ret}', event)">ID: ${h.ret}</button>
        </div>
        <div class="case-detail">SC: ${h.sc} • Phát hành: ${h.ph}</div>
        <div class="case-reason">${h.reason}</div>
      </div>`;
    });
    s.ks_list.forEach(k => {
      out += `<div class="case-card ${k.recoverable ? 'is-rec' : 'is-hard'}">
        <div class="case-top">
          <span class="case-type ${k.recoverable ? 'c-amber' : 'c-red'}">🚚 Kship (${k.tru}) • ${k.status}</span>
          <button class="ret-btn" onclick="copyRet('${k.ret}', event)">Ret: ${k.ret}</button>
        </div>
        <div class="case-detail">Ticket: <strong>${k.ticket}</strong> • Ghi nhận: ${k.pts}</div>
        <div class="case-reason">${k.reason}</div>
      </div>`;
    });
  }

  out += `<button class="copy-person-btn" onclick="copyPerson('${s.code}', event)">📋 Copy chi tiết gửi Zalo cho ${s.short_name}</button>`;
  return out;
}

function renderMain() {
  const q = document.getElementById('qInput').value.trim().toLowerCase();
  const wrap = document.getElementById('mainList');

  if (viewMode === 'staff') {
    const list = DATA.staff.filter(s => {
      if (staffFilter === 'PASS' && s.pct < 100) return false;
      if (staffFilter === 'MID' && (s.pct < 60 || s.pct >= 100)) return false;
      if (staffFilter === 'LOW' && s.pct >= 60) return false;
      if (staffFilter === 'BU' && s.bu_total === 0) return false;
      if (q) {
        const blob = [
          s.full_name, s.code, s.level,
          ...s.bu_hd_list.map(x => x.ret),
          ...s.bu_pay_list.map(x => x.ret),
          ...s.pay_khl_list.map(x => x.ret),
          ...s.hd_cx_list.map(x => x.ret),
          ...s.ks_list.map(x => x.ret + ' ' + x.ticket)
        ].join(' ').toLowerCase();
        if (!blob.includes(q)) return false;
      }
      return true;
    });

    if (!list.length) {
      wrap.innerHTML = `<div class="empty">Không tìm thấy nhân sự hoặc mã gian hàng phù hợp.</div>`;
      return;
    }

    wrap.innerHTML = list.map((s, idx) => {
      const isOpen = openCodes.has(s.code) || (q.length >= 5 && /^\d+$/.test(q));
      const rankCls = s.pct >= 100 ? 'rank-top' : (s.pct < 45 ? 'rank-low' : '');
      const colorCls = s.pct >= 100 ? 'c-green' : (s.pct >= 60 ? 'c-blue' : (s.pct >= 40 ? 'c-amber' : 'c-red'));
      const barCls = s.pct >= 100 ? 'bg-green' : (s.pct >= 60 ? 'bg-blue' : (s.pct >= 40 ? 'bg-amber' : 'bg-red'));
      const totCases = s.bu_hd_list.length + s.bu_pay_list.length + s.pay_khl_list.length + s.hd_cx_list.length + s.ks_list.length;
      const diffPill = s.diff > 0
        ? `<span class="mpill mp-green">Vượt +${s.diff}đ</span>`
        : (s.diff === 0 ? `<span class="mpill mp-green">Đạt 100%</span>` : `<span class="mpill ${s.pct>=60?'mp-amber':'mp-red'}">Thiếu ${Math.abs(s.diff)}đ</span>`);

      return `
        <div class="staff-card ${isOpen ? 'open' : ''}" id="card-${s.code}">
          <div class="card-head" onclick="toggleCard('${s.code}')">
            <div class="card-row1">
              <div class="card-left">
                <div class="rank ${rankCls}">#${idx + 1}</div>
                <div>
                  <div class="s-name">${s.short_name}</div>
                  <div class="s-meta">${s.code} • ${s.level}${s.region ? ' • ' + s.region : ''}</div>
                </div>
              </div>
              <div class="card-right">
                <div class="s-score ${colorCls}">${s.chot}<small>/${s.kpi}đ</small></div>
                <div class="s-pct ${colorCls}">${s.pct}%</div>
              </div>
            </div>
            <div class="bar-track">
              <div class="bar-fill ${barCls}" style="width:${Math.min(s.pct, 100)}%"></div>
              <div class="bar-mark"></div>
            </div>
            <div class="mini-pills">
              <div class="pill-row">
                <span class="mpill mp-slate">Tự: ${s.self_pts}đ</span>
                ${s.bu_total > 0 ? `<span class="mpill mp-green">+Bù ${s.bu_total}đ</span>` : ''}
                ${s.tru_total > 0 ? `<span class="mpill mp-red">-${s.tru_total}đ</span>` : ''}
                ${diffPill}
              </div>
              <span class="expand-hint">${totCases > 0 ? totCases + ' ca' : 'Khớp'} ▾</span>
            </div>
          </div>
          <div class="card-body">${renderCardBody(s)}</div>
        </div>
      `;
    }).join('');
  } else {
    let cases = getAllIssueCases().filter(c => {
      if (caseFilter === 'REC' && !c.recoverable) return false;
      if (caseFilter === 'PAY' && c.kind !== 'PAY') return false;
      if (caseFilter === 'HDDT' && c.kind !== 'HDDT') return false;
      if (caseFilter === 'KSHIP' && c.kind !== 'KSHIP') return false;
      if (q) {
        const blob = `${c.staff.full_name} ${c.ret} ${c.idShow} ${c.reason} ${c.label}`.toLowerCase();
        if (!blob.includes(q)) return false;
      }
      return true;
    });

    if (!cases.length) {
      wrap.innerHTML = `<div class="empty">Không có ca nào khớp bộ lọc.</div>`;
      return;
    }

    wrap.innerHTML = cases.map(c => `
      <div class="case-card ${c.recoverable ? 'is-rec' : 'is-hard'}" style="margin-bottom:0;box-shadow:0 2px 6px rgba(15,23,42,0.04)">
        <div class="case-top">
          <span class="case-type ${c.recoverable ? 'c-amber' : 'c-red'}">${c.label} (${c.tru}) • ${c.recoverable ? 'Kéo được' : 'Lỗi cứng'}</span>
          <button class="ret-btn" onclick="copyRet('${c.ret}', event)">ID: ${c.ret}</button>
        </div>
        <div class="case-detail"><strong>${c.staff.code} - ${c.staff.short_name}</strong> • SC: ${c.date}</div>
        <div class="case-detail">${c.extra}</div>
        <div class="case-reason">${c.reason}</div>
      </div>
    `).join('');
  }
}

renderHero();
renderChips();
renderMain();
</script>
</body>
</html>
